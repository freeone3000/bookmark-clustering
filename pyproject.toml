[project]
name = "bookmark-cluster"
version = "0.1.0"
description = "Spectral clustering for bookmarks"
requires-python = ">=3.12"
dependencies = [
    # url fetching encounters ocassional website roadblocks
    "requests",
    "beautifulsoup4",
    "trafilatura",
    "selenium",
    "selenium-stealth",
    # LM Studio integration for content extraction
    "lmstudio",
    "openai",
    # for clustering
    "numpy",
    "scikit-learn",
    "ipykernel>=7.2.0",
    # A/B testing web app
    "flask",
]

[dependency-groups]
dev = [
    "matplotlib",
    "scipy-stubs~=1.17.0",
]
postgres = [
    "pgserver",
    "pgvector",
    "psycopg[binary]",
]
